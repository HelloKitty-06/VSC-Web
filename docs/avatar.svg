<!-- 简约风格占位头像：浅蓝底色 + 灰蓝色人物剪影（可替换为自己的照片） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 裁剪区域：保证人物剪影不会超出圆形范围 -->
  <defs>
    <clipPath id="circle-clip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip)">
    <!-- 头像背景 -->
    <rect width="100" height="100" fill="#dce9fb"/>
    <!-- 头部 -->
    <circle cx="50" cy="38" r="16" fill="#9db4d0"/>
    <!-- 肩部 -->
    <path d="M50 62 C 68 62 82 74 82 100 L18 100 C18 74 32 62 50 62 Z" fill="#9db4d0"/>
  </g>
</svg>
